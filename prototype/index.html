<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes of the Deep — Cinématique d'introduction</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; }
  body { font-family:"Segoe UI", system-ui, sans-serif; color:#e8eef2; }

  /* ---------------------------------------------------- barres cinéma */
  #letterbox .bar {
    position:fixed; left:0; right:0; height:0; background:#000; z-index:20;
    transition:height .9s cubic-bezier(.4,0,.2,1);
  }
  #letterbox .bar.top { top:0; }
  #letterbox .bar.bot { bottom:0; }
  #letterbox.on .bar { height:9.5vh; }

  /* ------------------------------------------------------ sous-titres */
  #subwrap {
    position:fixed; left:50%; bottom:14vh; transform:translateX(-50%);
    width:min(86vw, 900px); text-align:center; z-index:22; pointer-events:none;
  }
  #speaker {
    font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:#7fc4d8; opacity:.85; margin-bottom:9px; display:none;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  #subtitle {
    font-size:21px; line-height:1.55; font-weight:300;
    text-shadow:0 2px 14px rgba(0,0,0,.95), 0 0 40px rgba(0,0,0,.7);
    opacity:0; transition:opacity .45s; letter-spacing:.3px;
  }
  #subtitle.on { opacity:1; }
  #subtitle.narration { font-style:italic; color:#cfe0e8; }

  /* --------------------------------------------------- texte d'ouverture */
  #title {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:24; pointer-events:none; padding:8vw; text-align:center;
  }
  #titletext {
    font-size:clamp(18px, 3vw, 34px); font-weight:200; line-height:1.7;
    letter-spacing:2px; opacity:0; transition:opacity 2s;
    text-shadow:0 0 50px rgba(0,0,0,.9);
  }
  #titletext.on { opacity:.94; }

  /* -------------------------------------------------------- fondu noir */
  #fade {
    position:fixed; inset:0; background:#000; z-index:23;
    opacity:1; pointer-events:none;
  }

  /* ------------------------------------------------------------ divers */
  #skip {
    position:fixed; right:22px; bottom:calc(9.5vh + 16px); z-index:25;
    font-size:10px; letter-spacing:3px; text-transform:uppercase;
    opacity:.35; transition:opacity .3s;
  }
  #skip.hide { opacity:0; }

  #objective {
    position:fixed; left:50%; top:6vh; transform:translateX(-50%);
    z-index:22; font-size:11px; letter-spacing:4px; text-transform:uppercase;
    opacity:0; transition:opacity .6s; text-align:center;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
  }
  #objective.on { opacity:.75; }
  #objective::before {
    content:''; display:block; width:26px; height:1px; margin:0 auto 10px;
    background:rgba(232,238,242,.4);
  }

  #hint {
    position:fixed; left:50%; bottom:11vh; transform:translateX(-50%);
    z-index:22; font-size:11px; letter-spacing:2px; opacity:0;
    transition:opacity .6s; text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  #hint.on { opacity:.6; }
  #hint b { color:#8fd8ff; }

  #start {
    position:fixed; inset:0; background:#000; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; cursor:pointer; text-align:center; padding:6vw;
  }
  #start h1 {
    font-size:clamp(22px,4vw,40px); font-weight:200; letter-spacing:12px;
    text-transform:uppercase;
  }
  #start .sub { font-size:11px; letter-spacing:5px; opacity:.45; text-transform:uppercase; }
  #start .go {
    margin-top:26px; font-size:11px; letter-spacing:4px; padding:13px 30px;
    border:1px solid rgba(143,216,255,.35); border-radius:2px;
  }
  #start .note {
    margin-top:22px; font-size:11px; opacity:.35; max-width:460px; line-height:1.7;
  }
  #start .alt {
    margin-top:30px; font-size:10px; letter-spacing:3px; text-transform:uppercase;
    color:#8fd8ff; opacity:.4; text-decoration:none; transition:opacity .3s;
  }
  #start .alt:hover { opacity:.9; }
  #loading { font-size:11px; letter-spacing:4px; opacity:.5; text-transform:uppercase; }

  #errbox {
    position:fixed; inset:auto 5vw 5vh 5vw; z-index:60; display:none;
    background:#2a0f10; border:1px solid #a33; border-radius:4px;
    padding:18px 22px; font-size:12px; line-height:1.7; color:#ffc9c9;
    font-family:ui-monospace, monospace; max-height:60vh; overflow:auto;
  }
  #errbox b { color:#ff8080; display:block; margin-bottom:8px;
              letter-spacing:2px; text-transform:uppercase; font-size:11px; }
  #warnbox {
    position:fixed; left:16px; top:16px; z-index:26; font-size:10px;
    letter-spacing:1px; opacity:.4; line-height:1.7; max-width:280px;
  }
</style>
</head>
<body>

<div id="letterbox"><div class="bar top"></div><div class="bar bot"></div></div>
<div id="title"><div id="titletext"></div></div>
<div id="subwrap"><div id="speaker"></div><div id="subtitle"></div></div>
<div id="objective"></div>
<div id="hint"><b>Z Q S D</b> marcher · <b>Maj</b> courir · <b>Souris</b> regarder</div>
<div id="skip">Échap passer le plan · <b>Entrée</b> tout passer</div>
<div id="fade"></div>
<div id="warnbox"></div>
<div id="errbox"></div>

<div id="start">
  <h1>Echoes of the Deep</h1>
  <div class="sub">Cinématique d'introduction</div>
  <div id="loading">Chargement…</div>
  <div class="go" style="display:none">Cliquer pour commencer</div>
  <div class="note"></div>
  <a class="alt" href="dive.html">→ Bac à sable de plongée</a>
</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>

<script>
// Filet de sécurité : toute erreur de chargement s'affiche à l'écran plutôt
// que de laisser une page noire silencieuse.
(function () {
  function show(msg) {
    var el = document.getElementById('errbox');
    if (!el) return;
    el.style.display = 'block';
    el.innerHTML = '<b>Erreur de chargement</b>' +
      String(msg).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    var s = document.getElementById('start');
    if (s) {
      var l = document.getElementById('loading');
      if (l) l.textContent = 'Échec du chargement — voir le message ci-dessous';
    }
  }
  window.addEventListener('error', function (e) {
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      show('Impossible de charger : ' + (e.target.src || e.target.href));
    } else {
      show((e.message || 'erreur inconnue') + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('Promesse rejetée : ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.__showError = show;
})();
</script>

<script type="module">
import * as THREE from 'three';
import { CinematicPlayer } from './cinematic.js';
import { buildVillage, buildOcean } from './village.js';
import { buildIntro } from './intro.js';
import { FollowSegment } from './follow.js';

// ---------------------------------------------------------------- RENDU
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 2000);

// ------------------------------------------------------------ ATMOSPHÈRE
// Fin d'après-midi : lumière rasante, ciel voilé
const SKY_TOP = new THREE.Color(0x3f6a86);
const SKY_HORIZON = new THREE.Color(0xc9a887);
scene.background = new THREE.Color(0x6f8ba0);
scene.fog = new THREE.FogExp2(0x8ba3b4, 0.0075);

// dôme de ciel en dégradé
{
  const skyGeo = new THREE.SphereGeometry(900, 32, 20);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top:{value:SKY_TOP}, hor:{value:SKY_HORIZON} },
    vertexShader: `varying float vY;
      void main(){ vY = normalize(position).y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying float vY; uniform vec3 top; uniform vec3 hor;
      void main(){ float t = smoothstep(-0.08, 0.55, vY);
        gl_FragColor = vec4(mix(hor, top, t), 1.0); }`,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

const hemi = new THREE.HemisphereLight(0xa8c8dd, 0x4a4238, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffd2a1, 2.1);
sun.position.set(-60, 34, -46);      // soleil bas, derrière l'île
scene.add(sun);

const fill = new THREE.DirectionalLight(0x7fa8c4, 0.5);
fill.position.set(40, 20, 50);
scene.add(fill);

// ------------------------------------------------------------- LE MONDE
const village = buildVillage(scene, { seed: 1337 });
const ocean = buildOcean(scene, { size: 1400 });

// ------------------------------------------------------------------ UI
const ui = {
  subtitle: document.getElementById('subtitle'),
  speaker:  document.getElementById('speaker'),
  letterbox:document.getElementById('letterbox'),
  fade:     document.getElementById('fade'),
  objective:document.getElementById('objective'),
};
const titleEl = document.getElementById('titletext');
const hintEl = document.getElementById('hint');
const skipEl = document.getElementById('skip');

const player = new CinematicPlayer(camera, ui);

// petites actions déclenchées depuis le script de la cinématique
const pulses = [];
const ctx = {
  scene, camera, village, ocean,
  setTitleText: (t) => { titleEl.textContent = t; },
  showTitle: (on) => { titleEl.classList.toggle('on', on); },
  pulseBulb: (bulb, dur) => {
    pulses.push({ bulb, t: 0, dur });
  },
  ringBell: () => { /* placeholder audio : la cloche du village */ },
};

// ------------------------------------------------------------ CHARGEMENT
let intro = null, follow = null, mode = 'idle';

(async () => {
  try {
  intro = await buildIntro(ctx);
  player.load(intro.shots);

  document.getElementById('loading').style.display = 'none';
  document.querySelector('#start .go').style.display = 'block';

  if (intro.usingPlaceholders) {
    document.querySelector('#start .note').textContent =
      'Certains modèles de personnages ne sont pas encore fournis : ' +
      'des silhouettes de substitution sont utilisées. Déposez les .glb ' +
      'dans models/ pour les remplacer.';
    document.getElementById('warnbox').textContent =
      'Modèles manquants → silhouettes de substitution';
  }

  player.onEnd = () => {
    // passage au segment jouable
    mode = 'play';
    follow = new FollowSegment({
      hero: intro.hero, guide: intro.oldMan, camera, village, ui,
      onArrive: () => {
        hintEl.classList.remove('on');
        setTimeout(() => {
          ui.subtitle.textContent = 'À suivre…';
          ui.subtitle.classList.add('on');
          ui.subtitle.classList.add('narration');
        }, 900);
      },
    });
    intro.hero.root.position.copy(intro.playStart.hero);
    intro.hero.root.position.y = village.groundY;
    intro.oldMan.root.position.copy(intro.playStart.guide);
    follow.start();
    player.fadeTo(0, 1.0);
    hintEl.classList.add('on');
    skipEl.classList.add('hide');
    camera.fov = 58; camera.updateProjectionMatrix();
    renderer.domElement.requestPointerLock();
    setTimeout(() => hintEl.classList.remove('on'), 9000);
  };
  } catch (err) {
    console.error(err);
    if (window.__showError) window.__showError(err && err.stack ? err.stack : err);
  }
})();

// ------------------------------------------------------------- CONTRÔLES
const startEl = document.getElementById('start');
startEl.addEventListener('click', () => {
  if (!intro) return;
  startEl.style.display = 'none';
  mode = 'cine';
  player.play();
  player.fadeTo(0, 2.0);
});

addEventListener('keydown', (e) => {
  if (mode === 'cine') {
    if (e.code === 'Escape') player.skipShot();
    if (e.code === 'Enter')  player.skipAll();
  }
  if (mode === 'play' && e.code === 'Escape') {
    document.exitPointerLock();
  }
});
renderer.domElement.addEventListener('click', () => {
  if (mode === 'play' && !document.pointerLockElement) {
    renderer.domElement.requestPointerLock();
  }
});

// ---------------------------------------------------------------- BOUCLE
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  village.update(dt);
  ocean.update(dt);

  // l'ampoule qui s'allume faiblement
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += dt;
    const u = Math.min(1, p.t / p.dur);
    const flicker = 0.55 + Math.sin(p.t * 17) * 0.16 + Math.sin(p.t * 5.3) * 0.2;
    const env = Math.sin(u * Math.PI);
    p.bulb.userData.light.intensity = env * flicker * 1.5;
    p.bulb.userData.glass.material.emissiveIntensity = 0.4 + env * flicker * 2.2;
    if (u >= 1) {
      p.bulb.userData.light.intensity = 0.35;
      p.bulb.userData.glass.material.emissiveIntensity = 0.9;
      pulses.splice(i, 1);
    }
  }

  if (mode === 'cine') {
    player.update(dt);
  } else if (mode === 'play' && follow) {
    follow.update(dt);
    for (const a of intro.actors) a.update(dt, clock.elapsedTime);
    player.update(dt);   // pour le fondu résiduel
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
